<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Odysseus · Settings</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #282c34;
        color: #abb2bf;
        font-family: "Fira Code", ui-monospace, monospace;
        font-size: 13px;
      }
      .wrap {
        padding: 20px 22px 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        color: #e06c75;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.4px;
      }
      .hint {
        margin: 0 0 16px;
        color: #7f8792;
        font-size: 11.5px;
        line-height: 1.55;
      }
      .hint code {
        color: #9aa4af;
      }
      ol.steps {
        margin: 6px 0 0;
        padding-left: 18px;
        color: #7f8792;
        font-size: 11.5px;
        line-height: 1.7;
      }
      ol.steps b {
        color: #abb2bf;
        font-weight: normal;
      }
      fieldset {
        border: 1px solid #2f343d;
        border-radius: 8px;
        margin: 0 0 14px;
        padding: 12px 14px 12px;
      }
      legend {
        color: #9aa4af;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 0 6px;
      }
      label.field-label {
        display: block;
        margin-bottom: 6px;
        color: #9aa4af;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      input[type="text"] {
        width: 100%;
        padding: 9px 11px;
        border-radius: 7px;
        border: 1px solid #3a3f4b;
        background: #21252b;
        color: #d7dae0;
        font-family: inherit;
        font-size: 12.5px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: #e06c75;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 9px 0;
        border-radius: 7px;
        cursor: pointer;
        border: 1px solid #3a3f4b;
        background: #2c313a;
        color: #abb2bf;
        font-family: inherit;
        font-size: 12px;
      }
      button:hover:not(:disabled) {
        background: #333945;
        color: #d7dae0;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        background: #e06c75;
        border-color: #e06c75;
        color: #fff;
        font-weight: bold;
      }
      button.primary:hover:not(:disabled) {
        background: #e98089;
      }
      .status {
        margin-top: 12px;
        min-height: 18px;
        font-size: 11.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status.ok {
        color: #98c379;
      }
      .status.err {
        color: #e06c75;
      }
      .status.busy {
        color: #d19a66;
      }
      .pref {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
        line-height: 1.5;
      }
      .pref input {
        margin-top: 2px;
        accent-color: #e06c75;
      }
      .pref small {
        display: block;
        color: #6b7280;
        font-size: 10.5px;
      }
      .foot {
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px solid #2c313a;
        color: #6b7280;
        font-size: 10.5px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>
        <svg width="15" height="15" viewBox="0 0 32 32">
          <path d="M16 4L16 22L6 22Z" fill="#e06c75" />
          <path d="M16 8L16 22L24 22Z" fill="#e06c75" opacity="0.6" />
          <path
            d="M4 24Q10 20 16 24Q22 28 28 24"
            stroke="#e06c75"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          /></svg
        ><span id="heading">Odysseus Shell</span>
      </h1>
      <p class="hint" id="subhint">
        A native window for your self-hosted Odysseus workspace.
      </p>

      <fieldset>
        <legend>Instance</legend>
        <label class="field-label" for="url">Server URL</label>
        <input
          id="url"
          type="text"
          spellcheck="false"
          placeholder="https://your-host.tailXXXX.ts.net"
        />
        <div class="row">
          <button id="check">Check</button>
          <button id="save" class="primary">Save &amp; connect</button>
        </div>
        <div class="status" id="status"></div>
      </fieldset>

      <fieldset>
        <legend>Shell preferences</legend>
        <label class="pref">
          <input type="checkbox" id="tray" />
          <span
            >Keep running in the system tray when the window is closed
            <small
              >Opt-in. When enabled, closing the window hides it to the tray —
              quit from the tray menu instead.</small
            >
          </span>
        </label>

        <label class="field-label" for="island" style="margin-top: 14px"
          >Smart island</label
        >
        <select
          id="island"
          style="
            width: 100%;
            padding: 7px 9px;
            border-radius: 7px;
            border: 1px solid #3a3f4b;
            background: #21252b;
            color: #d7dae0;
            font-family: inherit;
            font-size: 12px;
          "
        >
          <option value="off">Hidden</option>
          <option value="system" selected>System — RAM · CPU</option>
          <option value="clock">Clock</option>
          <option value="model">Active model</option>
          <option value="health">Instance health · latency</option>
        </select>
        <div
          id="island-hint"
          style="
            margin-top: 6px;
            min-height: 14px;
            font-size: 10.5px;
            color: #98c379;
          "
        ></div>
      </fieldset>

      <p class="foot">
        Ctrl+Shift+O or the ⛵ label in the titlebar reopens these settings
        anytime.
      </p>
    </div>

    <script>
      const tauri = window.__TAURI__;
      const $input = document.getElementById("url");
      const $status = document.getElementById("status");
      const $check = document.getElementById("check");
      const $save = document.getElementById("save");
      const $tray = document.getElementById("tray");
      const $island = document.getElementById("island");
      const $heading = document.getElementById("heading");
      const $subhint = document.getElementById("subhint");

      let configured = false;

      function setStatus(kind, msg) {
        $status.className = "status " + kind;
        $status.textContent = msg;
        $check.disabled = false;
      }

      function setFirstRunMode(on) {
        const oldSteps = document.querySelector("ol.steps");
        if (oldSteps) oldSteps.remove();
        if (on) {
          $heading.textContent = "Welcome to Odysseus Shell";
          $subhint.textContent =
            "Connect this desktop app to your own self-hosted Odysseus instance:";
          const steps = [
            "Host Odysseus anywhere you like — home server, VPS, NAS. Reach it over Tailscale or your LAN; HTTPS keeps things smooth.",
            "Paste its URL below and hit Check.",
            "Save & connect — done. Your logins stay per-instance.",
          ];
          const ol = document.createElement("ol");
          ol.className = "steps";
          for (const s of steps) {
            const li = document.createElement("li");
            li.textContent = s;
            ol.appendChild(li);
          }
          $subhint.after(ol);
        } else {
          $heading.textContent = "Odysseus Shell";
          $subhint.textContent =
            "Point the shell at any self-hosted Odysseus server — typically your Tailscale *.ts.net URL. It gets checked before switching.";
        }
      }

      // Handshake with retries: if the shell answers before our listener
      // finished registering on its side, the reply is dropped — so keep
      // asking until the init payload actually arrives.
      let initArrived = false;
      tauri.event.listen("settings://init", (e) => {
        initArrived = true;
        configured = !!(e.payload.url && e.payload.url.length);
        setFirstRunMode(!configured);
        if (!$input.value.trim()) $input.value = e.payload.url || "";
        $tray.checked = !!e.payload.minimizeToTray;
        $island.value = e.payload.islandMode || "system";
        setStatus("", "");
      });
      let tries = 0;
      const askReady = () => {
        if (initArrived || tries++ > 24) return;
        tauri.event.emit("settings://ready");
        setTimeout(askReady, 250);
      };
      askReady();

      tauri.event.listen("settings://result", (e) => {
        setStatus(
          e.payload.ok ? "ok" : "err",
          (e.payload.ok ? "\u2713 " : "\u2717 ") + e.payload.message
        );
        if (e.payload.ok && String(e.payload.message).startsWith("Island:")) {
          const hint = document.getElementById("island-hint");
          hint.textContent = "Applied \u2713";
          setTimeout(() => { hint.textContent = ""; }, 2000);
        }
      });
      tauri.event.listen("settings://saved", () => {
        configured = true;
        setFirstRunMode(false);
        setTimeout(() => { if (configured) window.close(); }, 700);
      });

      $check.addEventListener("click", () => {
        const url = $input.value.trim();
        if (!url) return setStatus("err", "✗ Enter a URL first.");
        $status.className = "status busy";
        $status.textContent = "Checking " + url + " …";
        $check.disabled = true;
        $save.disabled = true;
        tauri.event.emit("settings://validate", { url });
      });

      function doSave() {
        const url = $input.value.trim();
        if (!url) return setStatus("err", "✗ Enter a URL first.");
        $status.className = "status busy";
        $status.textContent = "Validating, then connecting …";
        $check.disabled = true;
        $save.disabled = true;
        tauri.event.emit("settings://save", { url });
      }
      $save.addEventListener("click", doSave);

      $tray.addEventListener("change", () => {
        tauri.event.emit("settings://pref", { minimizeToTray: $tray.checked });
      });

      $island.addEventListener("change", () => {
        tauri.event.emit("settings://island", { mode: $island.value });
      });

      $input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") doSave();
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") window.close();
      });
    </script>
  </body>
</html>
